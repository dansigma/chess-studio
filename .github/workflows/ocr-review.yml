name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

concurrency:
  group: ocr-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target'
          && (github.event.pull_request.head.repo.full_name == github.repository
              || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && (startsWith(github.event.comment.body, '/open-code-review') || startsWith(github.event.comment.body, '@open-code-review')))
    steps:
      - name: Resolve pull request
        id: pr
        if: github.event_name != 'pull_request_target'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr || github.event.issue.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@v1.14.1
        with:
          pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr || github.event.issue.number }}
          llm_url: https://opencode.ai/inference/go/v1
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: deepseek-v4.1-flash
          llm_use_anthropic: 'false'
          llm_extra_headers: x-opencode-session=ocr-${{ github.run_id }}-${{ github.run_attempt }}
          language: Portuguese
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
