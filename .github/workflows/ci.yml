name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: node scripts/audit-gate.mjs

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          NEXT_ALIAS_WORKERD_STUB: "1"

  vinext-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vinext bundle
        run: npm run build:vinext

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Smoke specs run against a production build served by Playwright's
      # webServer (see playwright.config.ts). The sign-in spec self-skips
      # without E2E_TEST_USER/E2E_TEST_PASSWORD, so no secrets are required.
      - name: Run e2e smoke tests
        run: npm run test:e2e
        env:
          NEXT_ALIAS_WORKERD_STUB: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Verify migration status
        run: supabase migration list --local

      - name: Verify folder cycle protection
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/folder_cycles.sql

      # A deny-all table must still declare a policy (see course_admins_no_client_access
      # ... using (false) at supabase/migrations/20260928210000_profiles_and_admins.sql:29-32):
      # RLS on with zero rows in pg_policies is a violation, indistinguishable from
      # "forgot to add policies".
      - name: Verify RLS contract on database
        run: |
          supabase db query --local "DO \$\$ DECLARE violations text[]; BEGIN SELECT array_agg(t.tablename ORDER BY t.tablename) INTO violations FROM pg_tables t LEFT JOIN (SELECT DISTINCT tablename FROM pg_policies WHERE schemaname = 'public') p ON p.tablename = t.tablename WHERE t.schemaname = 'public' AND (t.rowsecurity = false OR p.tablename IS NULL); IF violations IS NOT NULL AND array_length(violations, 1) > 0 THEN RAISE NOTICE 'RLS violations: %', array_to_string(violations, ', '); RAISE EXCEPTION 'RLS contract violated by: %', array_to_string(violations, ', '); ELSE RAISE NOTICE 'RLS contract OK'; END IF; END \$\$;"

