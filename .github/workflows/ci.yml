name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: node scripts/audit-gate.mjs

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          NEXT_ALIAS_WORKERD_STUB: "1"

  vinext-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vinext bundle
        run: npm run build:vinext

  e2e:
    runs-on: ubuntu-latest
    # A hung step inherits GitHub's 6-hour default. The whole suite normally
    # finishes in under 2 minutes, and the slowest legitimate run so far was
    # ~8 minutes (cold Playwright download), so 15 gives ample headroom while
    # still failing fast when the job wedges.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # `npx playwright install --with-deps` has hung here for 20+ minutes on
        # a cache miss even though it usually takes under a minute. Cap the
        # step so the browser download cannot eat the whole job budget; the
        # slowest successful install observed was ~7 minutes.
        timeout-minutes: 10
        run: npx playwright install chromium --with-deps

      # Smoke specs run against a production build served by Playwright's
      # webServer (see playwright.config.ts). The sign-in spec self-skips
      # without E2E_TEST_USER/E2E_TEST_PASSWORD, so no secrets are required.
      - name: Run e2e smoke tests
        run: npm run test:e2e
        env:
          NEXT_ALIAS_WORKERD_STUB: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Bump: check https://github.com/supabase/cli/releases for the newest
          # stable release and use its x.y.z here (never `latest`).
          version: 2.122.0

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Verify migration status
        run: supabase migration list --local

      - name: Verify folder cycle protection
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/folder_cycles.sql

      - name: Verify course content gate matrix
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/can_access_course.sql

      - name: Verify course column grants
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/courses_column_grants.sql

      - name: Verify puzzle seen execute grants
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/puzzle_seen_grants.sql

      # Write path: the AFTER trigger must sync outline + course_content when
      # courses.chapters is written through the privileged writer (service
      # role today). A security-invoker trigger would fail here on the
      # private schema / helper; failure means the gate backfill silently
      # stops on future writes. Runs as superuser (local CI only) because
      # only a privileged role can SET ROLE to service_role.
      - name: Verify courses sync trigger write path
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          create extension if not exists pgcrypto;
          set local role service_role;
          insert into public.courses (id, slug, title, summary, color, theme, chapters, access_tier, status, created_by)
          values (
            gen_random_uuid(), 'sync-write-check', 'Sync', '', 'white', 'openings',
            '[{"id":"ch9","title":"Synced","variations":[{"id":"v9","title":"Line","pgn":"1. e4 e5"}]}]',
            'free', 'published', null
          );
          do $$
          declare
            v_outline jsonb;
            v_chapters jsonb;
          begin
            select outline into v_outline from public.courses where slug = 'sync-write-check';
            if v_outline is null or v_outline::text like '%e4%' then
              raise exception 'sync trigger failed: outline carries move text or is missing: %', v_outline;
            end if;
            if v_outline #>> '{0,id}' <> 'ch9' then
              raise exception 'sync trigger failed: outline missing chapter id: %', v_outline;
            end if;
            select chapters into v_chapters from public.course_content
            where course_id = (select id from public.courses where slug = 'sync-write-check');
            if v_chapters is null or v_chapters #>> '{0,variations,0,pgn}' <> '1. e4 e5' then
              raise exception 'sync trigger failed: course_content missing full chapters';
            end if;
            raise notice 'sync trigger ok: outline + course_content written';
          end;
          $$;
          rollback;
          SQL

      # A deny-all table must still declare a policy (see course_admins_no_client_access
      # ... using (false) at supabase/migrations/20260928210000_profiles_and_admins.sql:29-32):
      # RLS on with zero rows in pg_policies is a violation, indistinguishable from
      # "forgot to add policies".
      - name: Verify RLS contract on database
        run: |
          supabase db query --local "DO \$\$ DECLARE violations text[]; BEGIN SELECT array_agg(t.tablename ORDER BY t.tablename) INTO violations FROM pg_tables t LEFT JOIN (SELECT DISTINCT tablename FROM pg_policies WHERE schemaname = 'public') p ON p.tablename = t.tablename WHERE t.schemaname = 'public' AND (t.rowsecurity = false OR p.tablename IS NULL); IF violations IS NOT NULL AND array_length(violations, 1) > 0 THEN RAISE NOTICE 'RLS violations: %', array_to_string(violations, ', '); RAISE EXCEPTION 'RLS contract violated by: %', array_to_string(violations, ', '); ELSE RAISE NOTICE 'RLS contract OK'; END IF; END \$\$;"

