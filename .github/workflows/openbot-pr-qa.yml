name: OpenBot PR QA dispatch

# Fast path for the OpenBot `pr-qa-dispatch` routine: GitHub's native webhook
# payload does not match the OpenBot envelope (`{type, occurredAt?, data?}`)
# and HMAC headers, so this workflow signs and forwards `pull_request_review`
# (submitted), `check_suite` (completed) and `workflow_run` (completed) events.
# The 60-minute `pr-qa-pipeline` reconciliation remains the fallback.
#
# `workflow_run` only fires for workflows that exist on the default branch, so
# that trigger starts working after this file is merged to master (same caveat
# as `ci-failure-comment.yml`). `workflows: ["CI"]` names which workflow's
# completion dispatches QA, mirroring the sibling. `pull_request_review` and
# `check_suite` work immediately. `workflow_dispatch` exists only for the
# manual smoke test.
#
# Loop protection: `workflows: ["CI"]` structurally excludes this workflow's
# own completions, and the guard step additionally skips any `workflow_run`
# event carrying this workflow's name. For `check_suite`, the guard step skips
# suites that already contain a completed run of this job (read-only checks
# API), so this workflow's own check runs can never re-trigger it.
#
# Requires the `OPENBOT_WEBHOOK_SECRET` repository secret (value from OpenBot >
# Routines > pr-qa-dispatch). The job fails closed when it is missing.

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  checks: read

jobs:
  openbot-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against self-trigger loops
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          CHECK_SUITE_ID: ${{ github.event.check_suite.id }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_RUN_NAME" = "OpenBot PR QA dispatch" ]; then
            echo "Skipping: triggered by this workflow's own completion."
            skip=true
          fi
          if [ "$EVENT_NAME" = "check_suite" ] && [ -n "${CHECK_SUITE_ID:-}" ]; then
            count=$(gh api "repos/$REPO/check-suites/$CHECK_SUITE_ID/check-runs" \
              --jq '[.check_runs[] | select(.name == "openbot-dispatch" and .status == "completed")] | length')
            if [ "${count:-0}" -gt 0 ]; then
              echo "Skipping: suite $CHECK_SUITE_ID already contains a completed openbot-dispatch run."
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Build OpenBot envelope
        if: steps.guard.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_STATE: ${{ github.event.review.state }}
          CHECK_SUITE_CONCLUSION: ${{ github.event.check_suite.conclusion }}
          CHECK_SUITE_HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          CHECK_SUITE_PRS: ${{ toJSON(github.event.check_suite.pull_requests) }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          occurred_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg type "github.$EVENT_NAME" \
            --arg occurredAt "$occurred_at" \
            --arg repository "$REPO" \
            --arg action "$EVENT_ACTION" \
            --arg event "$EVENT_NAME" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_head_ref "$PR_HEAD_REF" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg review_state "$REVIEW_STATE" \
            --arg check_suite_conclusion "$CHECK_SUITE_CONCLUSION" \
            --arg check_suite_head_sha "$CHECK_SUITE_HEAD_SHA" \
            --arg check_suite_prs "$CHECK_SUITE_PRS" \
            --arg workflow_run_conclusion "$WORKFLOW_RUN_CONCLUSION" \
            --arg workflow_run_head_branch "$WORKFLOW_RUN_HEAD_BRANCH" \
            --arg workflow_run_head_sha "$WORKFLOW_RUN_HEAD_SHA" \
            --arg workflow_run_prs "$WORKFLOW_RUN_PRS" \
            '($check_suite_prs | fromjson? // []) as $cs_prs
            | ($workflow_run_prs | fromjson? // []) as $wr_prs
            | (if $pr_number == "" then null else ($pr_number | tonumber?) end) as $top_num
            | (if $top_num != null then {
                number: $top_num,
                head_ref: (if $pr_head_ref == "" then null else $pr_head_ref end),
                head_sha: (if $pr_head_sha == "" then null else $pr_head_sha end)
              } elif ($cs_prs | length) > 0 then {
                number: $cs_prs[0].number,
                head_ref: $cs_prs[0].head.ref,
                head_sha: (if $check_suite_head_sha == "" then $cs_prs[0].head.sha else $check_suite_head_sha end)
              } elif ($wr_prs | length) > 0 then {
                number: $wr_prs[0].number,
                head_ref: $wr_prs[0].head.ref,
                head_sha: (if $workflow_run_head_sha == "" then $wr_prs[0].head.sha else $workflow_run_head_sha end)
              } else null end) as $pr
            | {
              type: $type,
              occurredAt: $occurredAt,
              data: {
                repository: $repository,
                action: (if $action == "" then null else $action end),
                event: $event,
                pull_request: $pr,
                review_state: (if $review_state == "" then null else $review_state end),
                check_suite: (if $check_suite_conclusion == "" then null else {
                  conclusion: $check_suite_conclusion,
                  head_sha: (if $check_suite_head_sha == "" then null else $check_suite_head_sha end),
                  pull_requests: [$cs_prs[] | .number]
                } end),
                workflow_run: (if $workflow_run_conclusion == "" then null else {
                  conclusion: $workflow_run_conclusion,
                  head_branch: (if $workflow_run_head_branch == "" then null else $workflow_run_head_branch end),
                  head_sha: (if $workflow_run_head_sha == "" then null else $workflow_run_head_sha end),
                  pull_requests: [$wr_prs[] | .number]
                } end)
              }
            }' > body.json
          bytes=$(wc -c < body.json)
          echo "Envelope built: $bytes bytes."
          if [ "$bytes" -ge 65536 ]; then
            echo "Envelope exceeds the 64 KB budget; refusing to send." >&2
            exit 1
          fi

      - name: Sign and POST to OpenBot
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENBOT_WEBHOOK_SECRET: ${{ secrets.OPENBOT_WEBHOOK_SECRET }}
          OPENBOT_WEBHOOK_URL: https://signal.openbot.run/v1/webhooks/2d2fd88f-45cb-4e70-9aee-b8197132c917
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${OPENBOT_WEBHOOK_SECRET:-}" ]; then
            echo "OPENBOT_WEBHOOK_SECRET is not configured." >&2
            echo "Add it in repo Settings > Secrets and variables > Actions" >&2
            echo "(value from OpenBot > Routines > pr-qa-dispatch), then re-run." >&2
            exit 1
          fi
          ts=$(date +%s)
          sig=$(python3 - "$ts" "$DELIVERY_ID" <<'PY'
          import hashlib
          import hmac
          import os
          import sys
          _, ts, delivery = sys.argv
          with open("body.json", "rb") as f:
              body = f.read()
          secret = os.environ["OPENBOT_WEBHOOK_SECRET"]
          print(hmac.new(secret.encode(), f"{ts}.{delivery}.".encode() + body, hashlib.sha256).hexdigest())
          PY
          )
          code=$(curl -sS -o response.txt -w "%{http_code}" --fail-with-body -X POST "$OPENBOT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-openbot-timestamp: $ts" \
            -H "x-openbot-delivery-id: $DELIVERY_ID" \
            -H "x-openbot-signature: sha256=$sig" \
            --data-binary @body.json)
          resp_bytes=$(wc -c < response.txt)
          echo "OpenBot responded with HTTP $code ($resp_bytes response bytes)."
          case "$code" in
            2*) exit 0 ;;
            *) echo "OpenBot dispatch failed with HTTP $code." >&2; exit 1 ;;
          esac
