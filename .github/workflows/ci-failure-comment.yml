name: CI failure comment

# The Factory wakes a builder only on the events its GitHub integration handles:
# issue_comment, pull_request, pull_request_review and push. A finished check run
# is dropped with `202 {ok:true, ignored:true}` (see mastra-ai/mastra#25712), so
# a red CI never reaches the agent that wrote the pull request.
#
# This workflow turns a failed CI run into one comment on the pull request. A
# comment is an `issue_comment`, which the Factory does handle, so the builder
# sees the failure and can fix it instead of waiting for a person to relay it.
#
# One comment per head commit: later runs on the same head edit it, because
# `edited` comments are ignored by the Factory and must not wake it again.
#
# Requires on the Factory host, otherwise the comment is filtered as an
# unauthorized sender:
#   MASTRACODE_GITHUB_AUTHORIZED_BOTS=github-actions[bot]
#
# `workflow_run` only fires for workflows that exist on the default branch, so
# this file starts working after it is merged to master.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ci-failure-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$number" ]; then
            # Singular endpoint: the plural one is deprecated.
            number=$(gh api "repos/$REPO/commits/$SHA/pull" --jq '.number // empty' 2>/dev/null || true)
          fi
          if [ -z "$number" ]; then
            echo "No open pull request for $SHA; nothing to report."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Write the comment body
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          {
            echo "<!-- factory-ci-failure:$SHA -->"
            echo "CI is red on \`${SHA:0:8}\` (branch \`$BRANCH\`)."
            echo
            echo "**Failed jobs**"
            echo "$jobs" | jq -r '.jobs[]
              | select(.conclusion == "failure" or .conclusion == "timed_out")
              | "- `" + .name + "` - " + .html_url'
            echo
            echo "**Passed jobs**"
            echo "$jobs" | jq -r '.jobs[]
              | select(.conclusion == "success")
              | "- `" + .name + "`"'
            echo
            echo "Full run: $RUN_URL"
            echo
            echo "_Posted by CI so the failure reaches the builder. The logs stay the source of truth._"
          } > body.md
          cat body.md

      - name: Post or update the comment
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"<!-- factory-ci-failure:$SHA -->\")) | .id] | first // empty")
          jq -Rs '{body: .}' body.md > payload.json
          if [ -n "${existing:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input payload.json > /dev/null
            echo "Updated comment $existing on PR #$PR."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" --input payload.json > /dev/null
            echo "Created a comment on PR #$PR."
          fi
